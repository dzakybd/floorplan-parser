[project]
name = "floorplan-parser"
version = "0.1.0"
description = "Construction drawing PDF to line geometry: vector-path and raster (OpenCV) extractors with a benchmark"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Dzaky Zakiyal Fawwaz", email = "dzakybd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=5.0",
    "pillow>=12.0",
    "pymupdf>=1.28",
    "shapely>=2.0",
    "svgelements>=1.9",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floorplan_parser"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
